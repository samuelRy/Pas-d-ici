<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <title>Créer un compte — Danses du Bénin</title>
</head>
<body>
  <header class="entete" id="entete"></header>
  <main class="contenu">
    <h1>Créer un compte</h1>
    <div class="alerte" id="alerte" role="alert" hidden></div>
    <form class="formulaire" id="formulaire">
      <label for="nom">Nom complet</label>
      <input id="nom" name="nom" type="text" autocomplete="name" required maxlength="120">

      <label for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="mot_de_passe">Mot de passe (8 caractères minimum)</label>
      <input id="mot_de_passe" name="mot_de_passe" type="password" autocomplete="new-password" required minlength="8" maxlength="72">

      <fieldset class="choix">
        <legend>Je m'inscris en tant que</legend>
        <label class="choix-option"><input type="radio" name="role" value="spectateur" checked> Spectateur</label>
        <label class="choix-option"><input type="radio" name="role" value="createur"> Créateur</label>
      </fieldset>
      <p class="note">Les comptes créateurs sont vérifiés par l'équipe avant la première publication.</p>

      <button type="submit" class="bouton bouton-large">Créer mon compte</button>
    </form>
    <p class="lien-bas">Déjà inscrit ? <a href="/connexion.html">Se connecter</a></p>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/inscription.js"></script>
</body>
</html>
