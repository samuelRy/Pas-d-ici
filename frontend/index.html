<!doctype html>
<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <title>Danses du Bénin</title>
</head>
<body>
  <header class="entete" id="entete"></header>
  <main class="contenu">
    <p class="note" id="note-attente" hidden>Votre compte créateur est en cours de vérification. Vous pourrez publier dès sa validation par l'équipe.</p>

    <h2>Récemment publié</h2>

    <p><a id="tout-explorer" href="/explorer.html">Tout explorer →</a></p>

  <script src="/js/api.js"></script>
